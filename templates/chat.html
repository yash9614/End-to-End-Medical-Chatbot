<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body, html { height: 100%; margin: 0; background: #f0f2f5; }
        .chat { margin-top: 20px; margin-bottom: 20px; }
        .msg_card_body { overflow-y: auto; max-height: 500px; }
        .msg_cotainer, .msg_cotainer_send { max-width: 70%; padding: 10px; border-radius: 15px; }
        .msg_cotainer { background: #e9ecef; }
        .msg_cotainer_send { background: #007bff; color: white; }
        .msg_time, .msg_time_send { font-size: 10px; color: #666; }
        .user_img, .user_img_msg { height: 40px; width: 40px; }
        .online_icon { position: absolute; height: 10px; width: 10px; background: #2ecc71; border-radius: 50%; bottom: 0; right: 0; }
    </style>
</head>
<body>
    <div class="container-fluid h-100">
        <div class="row justify-content-center h-100">
            <div class="col-md-8 col-xl-6 chat">
                <div class="card">
                    <div class="card-header msg_head">
                        <div class="d-flex bd-highlight">
                            <div class="img_cont position-relative">
                                <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img">
                                <span class="online_icon"></span>
                            </div>
                            <div class="user_info ml-3">
                                <span><strong>Medical Chatbot</strong></span>
                                <p class="mb-0 text-muted">Ask me anything about medical topics!</p>
                            </div>
                        </div>
                    </div>
                    <div id="messageFormeight" class="card-body msg_card_body"></div>
                    <div class="card-footer">
                        <form id="messageArea" class="input-group">
                            <input type="text" id="text" name="msg" placeholder="Type your message..." autocomplete="off" class="form-control type_msg" required>
                            <div class="input-group-append">
                                <button type="submit" id="send" class="btn btn-primary"><i class="fas fa-paper-plane"></i></button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $("#messageArea").on("submit", function(event) {
                event.preventDefault();
                const date = new Date();
                const str_time = date.getHours() + ":" + date.getMinutes().toString().padStart(2, '0');
                var rawText = $("#text").val().trim();
                if (!rawText) return;

                var userHtml = `
                    <div class="d-flex justify-content-end mb-4">
                        <div class="msg_cotainer_send">${rawText}<span class="msg_time_send">${str_time}</span></div>
                        <div class="img_cont_msg ml-2"><img src="https://i.ibb.co/d5b84Xw/Untitled-design.png" class="rounded-circle user_img_msg"></div>
                    </div>`;
                $("#text").val("");
                $("#messageFormeight").append(userHtml);
                $("#messageFormeight").scrollTop($("#messageFormeight")[0].scrollHeight);

                $.ajax({
                    data: { msg: rawText },
                    type: "POST",
                    url: "/get",
                    success: function(data) {
                        var botHtml = `
                            <div class="d-flex justify-content-start mb-4">
                                <div class="img_cont_msg mr-2"><img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img_msg"></div>
                                <div class="msg_cotainer">${data}<span class="msg_time">${str_time}</span></div>
                            </div>`;
                        $("#messageFormeight").append(botHtml);
                        $("#messageFormeight").scrollTop($("#messageFormeight")[0].scrollHeight);
                    },
                    error: function() {
                        var botHtml = `<div class="d-flex justify-content-start mb-4"><div class="msg_cotainer text-danger">Error getting response. Please try again.</div></div>`;
                        $("#messageFormeight").append(botHtml);
                    }
                });
            });
        });
    </script>
</body>
</html>
